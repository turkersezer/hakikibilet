<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B48" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="ticketBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="sealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#10B981" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Circular Pulse in Background -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.15" />
  <circle cx="256" cy="256" r="230" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.1" />

  <!-- Central Emblem (Ticket + Shield) -->
  <g transform="translate(100, 95)" filter="url(#shadow)">
    <!-- Main Ticket Body -->
    <path d="M 60 70 
             L 155 22 
             A 22 22 0 0 1 183 40 
             L 235 14 
             A 16 16 0 0 1 257 24 
             L 297 96 
             A 22 22 0 0 1 282 124 
             L 297 151 
             A 16 16 0 0 1 288 170 
             L 195 218 
             A 22 22 0 0 1 167 200 
             L 115 226 
             A 16 16 0 0 1 93 216 
             L 53 144 
             A 22 22 0 0 1 68 116 
             L 53 89 
             A 16 16 0 0 1 60 70 Z" 
          fill="url(#ticketBodyGrad)" />

    <!-- Ticket Perforation Line -->
    <line x1="125" y1="58" x2="220" y2="204" 
          stroke="#0F2B48" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-dasharray="10,12" 
          opacity="0.8" />

    <!-- Corner Decorative Elements inside ticket -->
    <circle cx="102" cy="105" r="9" fill="#0F2B48" opacity="0.85" />
    <rect x="94" y="125" width="45" height="8" rx="4" fill="#0F2B48" opacity="0.3" transform="rotate(-30 94 125)" />
    <rect x="110" y="145" width="30" height="8" rx="4" fill="#0F2B48" opacity="0.2" transform="rotate(-30 110 145)" />

    <!-- The Authentic Seal Shield (Lower Right) -->
    <g transform="translate(150, 115)" filter="url(#sealGlow)">
      <!-- Outer White Border -->
      <path d="M 68 8 
               C 105 8, 126 22, 126 22 
               C 126 76, 99 122, 68 140 
               C 37 122, 10 76, 10 22 
               C 10 22, 31 8, 68 8 Z" 
            fill="#FFFFFF" />

      <!-- Emerald Shield Body -->
      <path d="M 68 16 
               C 98 16, 116 28, 116 28 
               C 116 72, 92 112, 68 128 
               C 44 112, 20 72, 20 28 
               C 20 28, 38 16, 68 16 Z" 
            fill="url(#shieldGrad)" />

      <!-- Bold White Checkmark -->
      <path d="M 38 66 
               L 56 86 
               L 96 46" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="14" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>
  </g>
</svg>
