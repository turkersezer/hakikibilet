<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="ticketGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2B48" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="sealGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ICON EMBLEM (Left: Tilted Ticket with Authentic Checkmark Shield) -->
  <g transform="translate(15, 10)">
    <!-- Tilted Ticket Outer Body -->
    <path d="M 22 25 
             L 52 8 
             A 7 7 0 0 1 61 14 
             L 78 5 
             A 5 5 0 0 1 85 8 
             L 98 32 
             A 7 7 0 0 1 93 41 
             L 98 50 
             A 5 5 0 0 1 95 56 
             L 65 74 
             A 7 7 0 0 1 56 68 
             L 39 77 
             A 5 5 0 0 1 32 74 
             L 19 50 
             A 7 7 0 0 1 24 41 
             L 19 32 
             A 5 5 0 0 1 22 25 Z" 
          fill="url(#ticketGradient)" 
          stroke="#0F2B48" 
          stroke-width="2" 
          stroke-linejoin="round" />

    <!-- Perforation Dashed Line inside ticket -->
    <line x1="42" y1="20" x2="72" y2="68" 
          stroke="#38BDF8" 
          stroke-width="2.5" 
          stroke-linecap="round" 
          stroke-dasharray="4,4" 
          opacity="0.85" />

    <!-- Corner Decorative Element -->
    <circle cx="34" cy="36" r="3.5" fill="#38BDF8" opacity="0.9" />

    <!-- Authentic Shield Guarantee Seal (Overlapping Bottom Right) -->
    <g transform="translate(48, 38)" filter="url(#glow)">
      <!-- Shield Outer White Border -->
      <path d="M 22 2 
               C 35 2, 42 7, 42 7 
               C 42 24, 33 39, 22 45 
               C 11 39, 2 24, 2 7 
               C 2 7, 9 2, 22 2 Z" 
            fill="#FFFFFF" />
      
      <!-- Shield Body Emerald Gradient -->
      <path d="M 22 5 
               C 33 5, 39 9, 39 9 
               C 39 23, 31 36, 22 41 
               C 13 36, 5 23, 5 9 
               C 5 9, 11 5, 22 5 Z" 
            fill="url(#sealGradient)" />

      <!-- Verified Checkmark (Bold White) -->
      <path d="M 12 21 
               L 18 28 
               L 31 15" 
            fill="none" 
            stroke="#FFFFFF" 
            stroke-width="4.5" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>
  </g>

  <!-- BRAND TYPOGRAPHY (Right: HakikiBilet) -->
  <g transform="translate(135, 68)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="-0.5px">
      <tspan fill="#0F2B48">Hakiki</tspan>
      <tspan fill="#10B981">Bilet</tspan>
    </text>
  </g>

  <!-- SLOGAN SUBTITLE -->
  <g transform="translate(137, 94)">
    <text font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="12" 
          font-weight="800" 
          fill="#64748B" 
          letter-spacing="3.5px">
      BİLETİN HAKİKİSİ • hakikibilet.com
    </text>
  </g>
</svg>
