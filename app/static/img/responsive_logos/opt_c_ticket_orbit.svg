<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="bgC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0C4A60"/>
    </linearGradient>
    <linearGradient id="ringC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadowC" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0C4A60" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Yumuşak Bilet Formu / Squircle -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="url(#bgC)" filter="url(#shadowC)"/>
  <rect x="11" y="11" width="78" height="78" rx="21" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.8"/>
  <!-- Yörünge Halkası (Orbit) -->
  <ellipse cx="50" cy="50" rx="34" ry="18" transform="rotate(-30 50 50)" fill="none" stroke="url(#ringC)" stroke-width="3" stroke-linecap="round" stroke-dasharray="100 25"/>
  <!-- Merkezdeki Jet Uçak (Büyük ve Ultra Net) -->
  <g transform="translate(50, 48) rotate(-30)">
    <path d="M0 -28 C2.5 -28 3.8 -20 3.8 -9 L24 7 L24 12 L3.8 7 L3.8 19 L10 24 L10 28 L0 25.5 L-10 28 L-10 24 L-3.8 19 L-3.8 7 L-24 12 L-24 7 L-3.8 -9 C-3.8 -20 -2.5 -28 0 -28 Z" fill="#FFFFFF"/>
    <!-- Uçak kanat ve gövde detayı -->
    <path d="M0 -15 L0 18" stroke="#0284C7" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>